volumes:
  api:
  ui-node_modules:

networks:
  local:
  traefik:
    external: true
  jetstream:
    external: true

services:
  ui:
    build:
      context: .
      target: ui-dev
      dockerfile: docker/Dockerfile
    volumes:
    - ./vue:/app
    - ui-node_modules:/app/node_modules
    environment:
      DEBUG: "true"
      NODE_ENV: development
    networks:
    - local
    - traefik
    labels:
      traefik.enable: true
      traefik.docker.network: traefik
      # HTTP: redirect to HTTPS so the SPA always gets a browser secure context
      traefik.http.routers.hq.rule: Host(`hq.local.nathejk.dk`) || Host(`hq.dev.nathejk.dk`)
      traefik.http.routers.hq.entrypoints: web
      traefik.http.routers.hq.middlewares: redirect-to-https
      traefik.http.routers.hq.service: hq
      # HTTPS: serve with the desec cert
      traefik.http.routers.hq-secure.rule: Host(`hq.local.nathejk.dk`) || Host(`hq.dev.nathejk.dk`)
      traefik.http.routers.hq-secure.entrypoints: websecure
      traefik.http.routers.hq-secure.tls.certresolver: desec
      traefik.http.routers.hq-secure.service: hq

  api:
    build:
      context: .
      target: base
      dockerfile: docker/Dockerfile
    volumes:
    - ./go:/app
    # Sibling checkout of github.com/nathejk/shared-go. The path inside the
    # container matches what go/go.work expects (../../shared-go relative to
    # /app resolves to /shared-go).
    - ../shared-go:/shared-go
    - api:/go
    networks:
    - local
    - jetstream
    environment:
      #GO_BUILD_FLAGS: -race
      JETSTREAM_DSN: nats://jetstream:4222
      DB_DSN: root:ib@tcp(mysql:3306)/hq?parseTime=true&multiStatements=true
      SMS_DSN: cpsms://TOKEN@api.cpsms.dk
      #REDIS_ADDR: redis:6379
      #MONOLITH_BASEURL: https://natpas.nathejk.dk
      JWT_COOKIE_NAME: jwttoken
      AUTH_BASEURL: https://lukmigind.nathejk.dk
    depends_on:
    - mysql

  mysql:
    image: mariadb:10.8
    environment:
      MYSQL_ROOT_PASSWORD: ib
      MYSQL_DATABASE: hq
      MYSQL_USER: nathejk
      MYSQL_PASSWORD: kodeord
      TZ: Europe/Copenhagen
    networks:
    - local

  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DEFAULT_USER: nathejk
      ADMINER_DEFAULT_PASSWORD: kodeord
      ADMINER_DEFAULT_DB: hq
    networks:
    - local
    - traefik
    labels:
      traefik.enable: true
      traefik.docker.network: traefik
      traefik.http.routers.hq-sql.rule: Host(`mysql.hq.local.nathejk.dk`) || Host(`mysql.hq.dev.nathejk.dk`)
      traefik.http.services.hq-sql.loadbalancer.server.port: 8080
    depends_on:
    - mysql
